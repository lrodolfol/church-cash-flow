apiVersion: apps/v1
kind: Deployment
metadata:
  name: church-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: church
  template:
    metadata:
      labels:
        app: church
    spec:
      containers:
        - name: microsservice-church
          image: church:0.0.1
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "200Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "uat"
            - name: KEYUSERCREATED
              value: "AAECAwQFBgcICQoUAT0ODw=="
            - name: PASSEMAIL
              value: "#senhaforte123"
            - name: AWS_ACCESS_KEY_ID
              value: "my-key"
            - name: AWS_SECRET_ACCESS_KEY
              value: "my-secret"
            - name: AWS_SESSION_TOKEN
              value: "your_session_token"
            - name: DATABASE__USER
              value: "root"
            - name: DATABASE__PORT
              value: "3306"
            - name: DATABASE__PASSWORD
              value: "sinqia123"
            - name: DATABASE__HOST
              value: "mmysql"
            - name: DATABASE__DB
              value: "ChurchCashFlow"
            - name: MONGO__USER
              value: "mongoadmin"
            - name: MONGO__PORT
              value: "27017"
            - name: MONGO__PASSWORD
              value: "passMongoDb123"
            - name: MONGO__HOST
              value: "mongo"
            - name: MONGO__DB
              value: "biblia"
            - name: CACHE__HOST
              value: "mredis"
            - name: CACHE__PORT
              value: "6379"
            - name: CACHE__PASSWORD
              value: "sinqia123"
            - name: CACHE__INSTANCENAME
              value: "churchManager-"
            - name: MESSAGEBROKER__USERNAME
              value: "sinqia"
            - name: MESSAGEBROKER__PASSWORD
              value: "sinqia123"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: church-service
spec:
  selector:
    app: church
  ports:
    - protocol: TCP
      port: 8080       # porta do service no cluster
      targetPort: 8080 # porta do container
      nodePort: 30001  # porta exposta no host
  type: NodePort